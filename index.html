<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V7.5 FINAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0f0a1f;color:#fff;font-family:Arial}
.header{display:flex;justify-content:space-between;padding:12px;background:#1a1233}
.card{background:#1e1239;margin:12px;padding:20px;border-radius:16px}
.btn-y{background:#ffeb3b;color:#000;width:100%;padding:18px;border:none;border-radius:12px;font-weight:900;font-size:20px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #555;background:#000;color:#fff;margin:8px 0;font-size:16px}
</style></head><body>
<div class="header"><div style="font-weight:900">LIVE KENYA <span style="color:#ffeb3b">DLS V7.5</span></div><div style="background:#ffeb3b;color:#000;padding:6px 12px;border-radius:20px;font-weight:900">KES 0.00</div></div>

<div id="auth" class="card">
<h2>Register V7.5 - TAP BELOW</h2>
<input value="0112678036" id="ph">
<input value="1234" id="pin">
<button class="btn-y" onclick="go()" ontouchstart="go()">🚀 TAP TO ENTER - 100% WORKS</button>
<p id="st" style="color:#ffeb3b;margin-top:10px">Tap button to enter</p>
</div>

<div id="home" class="card" style="display:none">
<h2 style="color:#4caf50">✅ SUCCESS! YOU ARE IN!</h2>
<h3>🚀 Boost Plane HOT MAIN BOOST 12%</h3>
<div style="height:150px;background:#0a0520;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;border:2px solid #ff3b6b;margin:10px 0" id="box">1.00x ✈️</div>
<input placeholder="Bet 100-1000" id="bet" type="number" value="100">
<div style="display:flex;gap:8px"><button class="btn-y" style="background:#ff3b6b;color:#fff" onclick="fly()">Bet & Fly</button><button class="btn-y" style="background:#4caf50;color:#fff" onclick="cash()">Cash Out</button></div>
<p id="res" style="font-size:13px;margin-top:8px"></p>
<hr style="margin:12px 0">
<h3>⚽ DLS Partners 12% - Pot 1000 = You keep 120</h3>
<p style="font-size:12px">Deposit to 0112678036 M-Pesa</p>
<p id="comm" style="color:#ffeb3b;font-size:20px;font-weight:900;margin-top:10px">YOUR COMMISSION 12%: KES 0</p>
<button class="btn-y" style="margin-top:10px" onclick="location.reload()">Logout</button>
</div>

<script>
var comm=0; var mult=1; var playing=false; var stake=0; var iv=null;
function go(){
 document.getElementById('st').innerText='Entering...';
 try{ localStorage.setItem('test','1'); }catch(e){}
 document.getElementById('auth').style.display='none';
 document.getElementById('home').style.display='block';
}
function fly(){
 if(playing) return; stake=parseInt(document.getElementById('bet').value)||100;
 playing=true; mult=1; document.getElementById('box').innerText='1.00x';
 document.getElementById('res').innerText='Flying...';
 if(Math.random()<0.12){
   document.getElementById('box').innerText='1.00x CRASH!'; document.getElementById('res').innerText='Instant Crash! You keep 100% KES '+stake; comm+=stake; document.getElementById('comm').innerText='YOUR COMMISSION 12%: KES '+comm; playing=false; return;
 }
 var crash=Math.random()*5+1.5;
 iv=setInterval(function(){
   mult+=0.05; document.getElementById('box').innerText=mult.toFixed(2)+'x ✈️';
   if(mult>=crash){ clearInterval(iv); playing=false; document.getElementById('box').innerText=mult.toFixed(2)+'x CRASH!'; document.getElementById('res').innerText='Crashed! Lost '+stake; comm+=stake*0.12; document.getElementById('comm').innerText='YOUR COMMISSION 12%: KES '+comm; }
 },100);
}
function cash(){
 if(!playing) return; clearInterval(iv); playing=false;
 var profit=stake*(mult-1); var c=profit*0.12; comm+=c;
 document.getElementById('box').innerText='WIN '+mult.toFixed(2)+'x'; document.getElementById('res').innerText='Cashed '+mult.toFixed(2)+'x Profit '+(profit-c).toFixed(0)+' Commission '+c.toFixed(0);
 document.getElementById('comm').innerText='YOUR COMMISSION 12%: KES '+comm;
}
</script></body></html>
